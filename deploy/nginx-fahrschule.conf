# Host Nginx vhost for the Fahrschulverwaltung.
# Place at /etc/nginx/sites-available/fahrschule.pumpline.systems and symlink
# into sites-enabled (or drop into conf.d/). Then: nginx -t && systemctl reload nginx.
#
# TLS: either Let's Encrypt (certbot --nginx -d fahrschule.pumpline.systems)
# fills in the ssl_certificate lines, or use a Cloudflare Origin Certificate.
# Cloudflare may additionally proxy the DNS record (orange cloud).

map $http_upgrade $fs_connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP -> HTTPS (and ACME challenge for certbot).
server {
    listen 80;
    listen [::]:80;
    server_name fahrschule.pumpline.systems;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fahrschule.pumpline.systems;

    # --- TLS (adjust paths; certbot sets these automatically) ---------------
    ssl_certificate     /etc/letsencrypt/live/fahrschule.pumpline.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahrschule.pumpline.systems/privkey.pem;

    # HSTS: browsers use HTTPS only for this domain (1 year).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable upload size for PDF/exports etc.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;   # the "web" container (see WEB_PORT)
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # tells the API it's HTTPS
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $fs_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
